[project]
authors = [{name = "Eduardo Bouhid", email = "eduardobouhid.neto@gmail.com"}]
dependencies = []
name = "epistemic-sycophancy"
requires-python = ">= 3.10"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
epistemic_sycophancy = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.10.*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

[tool.pixi.feature.test.tasks]
test = "pytest -q"
test-fast = "pytest -m 'not real_model and not slow and not gpu' -q"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = "*"

[tool.pixi.feature.dev.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"

[tool.pixi.environments]
test = ["test"]
dev = ["test", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests with no transformer or real SAE",
    "property: property-based invariant tests",
    "integration: deterministic toy-model integration tests",
    "real_model: pinned real-model smoke or regression tests",
    "slow: long-running tests",
    "gpu: tests that require a GPU",
]
