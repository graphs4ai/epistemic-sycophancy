[project]
authors = [{name = "Eduardo Bouhid", email = "eduardobouhid.neto@gmail.com"}]
dependencies = ["cma>=4.4.4,<5"]
name = "epistemic-sycophancy"
requires-python = ">= 3.10"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  "linux-64",
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" },
]

[tool.pixi.pypi-dependencies]
epistemic_sycophancy = { path = ".", editable = true }

[tool.pixi.tasks]
run-identity = "python -m epistemic_sycophancy.runner.cli identity"
run-baseline = "python -m epistemic_sycophancy.runner.cli baseline_partitions"
run-fs = "python -m epistemic_sycophancy.runner.cli feature_selection"
run-opt-smoke = "python -m epistemic_sycophancy.runner.cli opt_smoke"
run-study = "python -m epistemic_sycophancy.runner.cli full_study --freeze-status sealed"

[tool.pixi.dependencies]
python = "3.10.*"

[tool.pixi.feature.cpu]
platforms = ["linux-64"]

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = ">=2.13.0,<3"

[tool.pixi.feature.cuda]
platforms = ["linux-64-cuda"]

[tool.pixi.feature.cuda.dependencies]
pytorch-gpu = ">=2.13.0,<3"
cuda-version = "12.9.*"

[tool.pixi.feature.cuda.tasks]
test-gpu = "pytest -m 'real_model or gpu' -q"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
hypothesis = "*"
transformers = ">=5.14.1,<6"

[tool.pixi.feature.test.tasks]
test = "pytest -q"
test-fast = "pytest -m 'not real_model and not slow and not gpu' -q"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = "*"

[tool.pixi.feature.dev.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"

[tool.pixi.environments]
default = ["cpu"]
test = ["test", "cpu"]
dev = ["test", "dev", "cpu"]
cuda = ["cuda"]
test-cuda = ["test", "cuda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests with no transformer or real SAE",
    "property: property-based invariant tests",
    "integration: deterministic toy-model integration tests",
    "real_model: pinned real-model smoke or regression tests",
    "slow: long-running tests",
    "gpu: tests that require a GPU",
]

[dependency-groups]
cuda = ["sae-lens>=6.47.0,<7"]
